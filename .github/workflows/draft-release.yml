name: Draft Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Wait for CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --event push --commit "$TARGET_SHA" \
              --json status,conclusion --limit 1)"
            status="$(jq -r '.[0].status // empty' <<<"$runs")"
            conclusion="$(jq -r '.[0].conclusion // empty' <<<"$runs")"
            if [ "$status" = completed ] && [ "$conclusion" = success ]; then
              latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
              if [ "$latest_sha" != "$TARGET_SHA" ]; then
                echo 'Skipping a commit superseded on main.'
                exit 0
              fi
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$status" = completed ]; then
              echo "::error::CI finished with $conclusion; leaving the draft unchanged."
              exit 1
            fi
            sleep 15
          done
          echo '::error::Timed out waiting for CI.'
          exit 1
      - name: Create or update draft release
        if: steps.ci.outputs.ready == 'true'
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          commitish: ${{ github.sha }}
          config-name: release-drafter.yml
          publish: 'false'
