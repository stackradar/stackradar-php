name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - name: Install dependencies
        run: composer update --prefer-dist --prefer-stable --no-interaction --no-progress
        env:
          COMPOSER_PREFER_LOWEST: ${{ matrix.dependencies == 'lowest' && '1' || '0' }}
      - run: composer analyse
      - run: composer test
      - run: vendor/bin/pint --test
        if: matrix.php == '8.3' && matrix.dependencies == 'highest'
